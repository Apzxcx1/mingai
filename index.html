  <script>
    document.getElementById('year').textContent=new Date().getFullYear();
    const box=document.querySelector('.lightbox'),big=box.querySelector('img'),cap=box.querySelector('.caption');
    document.querySelectorAll('.photo,.feature').forEach(card=>card.addEventListener('click',()=>{const img=card.querySelector('img');big.src=img.src;big.alt=img.alt;cap.textContent='';box.classList.add('open')}));
